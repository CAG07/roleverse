name: Ingest Rules Embeddings

on:
  workflow_dispatch:
    inputs:
      system:
        description: 'Game system to re-index'
        required: true
        type: choice
        options:
          - 5E_2014
          - ADD2E
          - PATHFINDER_2E
          - DCC

jobs:
  ingest:
    name: Ingest ${{ inputs.system }}
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run ingestion
        run: npx tsx scripts/run-ingestion.ts ${{ inputs.system }}
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_OPTIONS: --max-old-space-size=12288
        timeout-minutes: 120
